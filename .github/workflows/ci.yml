name: Verify CLI bridge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked CLI, Bolt and MCP dependencies
        run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fixture transport, lifecycle and no-model CLI compatibility tests
        run: npm test
      - name: Audit dependencies (required; no advisory-endpoint bypass)
        run: npm audit --audit-level=moderate
